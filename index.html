<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Renderer Content Security Policy. The production bundle loads no inline
      script and only talks to its own origin; the development server replaces
      this tag with the mode-aware variant (Vite React Fast Refresh + HMR).
      The same policy is also sent as a response header by the local server.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'self' http://127.0.0.1:* http://localhost:*; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob: data:; child-src 'self' blob: data:; media-src 'self' data: blob:; manifest-src 'self'" />
    <title>QUILLIX</title>
    <meta name="description" content="Production-grade Windows desktop AI coding agent with local Qwen intelligence through Ollama, codebase indexer, Monaco editor, terminal, Git integration, and autonomous repair loops." />
    <meta property="og:title" content="QUILLIX" />
    <meta property="og:description" content="Production-grade Windows desktop AI coding agent with local Qwen intelligence through Ollama, codebase indexer, Monaco editor, terminal, Git integration, and autonomous repair loops." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
